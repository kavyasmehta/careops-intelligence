services:
  mongo:
    image: mongo:7
    container_name: careops-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - careops-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: careops-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/careops-dev-password
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - careops-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: careops-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    container_name: careops-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  careops-mongo-data:
  careops-neo4j-data:
